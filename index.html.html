<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 르샤틀리에 원리 시뮬레이션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecef;--panel:#f5f8f7;--ink:#17252e;--sub:#56656f;--line:#c4cfd5;--accent:#1f6f8b;--grid:#d7e0e5;--gbg:#fbfcfc;--ok:#1f8a5b;--warn:#b86a00;--cold:#2f6fed;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--panel:#1a242b;--ink:#e6eef2;--sub:#9aabb5;--line:#31424b;--accent:#5fc0de;--grid:#2a3a43;--gbg:#151e24;--ok:#4cd08f;--warn:#f0a43a;--cold:#7aa2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181d;--panel:#1a242b;--ink:#e6eef2;--sub:#9aabb5;--line:#31424b;--accent:#5fc0de;--grid:#2a3a43;--gbg:#151e24;--ok:#4cd08f;--warn:#f0a43a;--cold:#7aa2ff;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:340px 1fr;height:100%;gap:10px;padding:10px;box-sizing:border-box}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-y:auto}
h1{font-size:18px;margin:0 0 2px;font-weight:700}
.eq{color:var(--sub);margin:0 0 12px;font-size:13px}
.ctl{margin:10px 0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl output{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;margin-top:4px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 9px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.reset{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.btnrow{display:flex;gap:8px;margin-top:8px}.btnrow button{flex:1;padding:8px;font-weight:700}
.chk{display:block;margin-top:8px;color:var(--sub)}
#status{margin-top:12px;border:1px solid var(--line);border-left-width:6px;border-radius:6px;padding:9px 11px;line-height:1.5}
#status b{display:block;font-size:15px}
#status[data-s=zero]{border-left-color:var(--cold)}
#status[data-s=eq]{border-left-color:var(--ok)}
#status[data-s=shift]{border-left-color:var(--warn)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:3px 2px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:500}
.right{display:grid;grid-template-rows:1fr 260px;gap:10px;min-height:0;min-width:0}
#scene{position:relative;border-radius:10px;overflow:hidden;background:#1b2a33;min-height:0}
#scene canvas{display:block}
#hint{position:absolute;left:10px;bottom:8px;color:#9fb4bf;font-size:12px;pointer-events:none}
#legend{position:absolute;left:10px;top:10px;color:#dbe6ec;font-size:12.5px;line-height:1.7;background:rgba(10,20,26,.55);padding:7px 10px;border-radius:8px;pointer-events:none}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#gwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.gp{background:var(--gbg);border:1px solid var(--line);border-radius:10px;min-height:0;position:relative}
.gp canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:820px){
 html,body{height:auto}
 .app{grid-template-columns:1fr;height:auto}
 .right{grid-template-rows:56vh 560px}
 #gwrap{grid-template-columns:1fr}
 .panel{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
 <aside class="panel">
  <h1>르샤틀리에 원리 3D</h1>
  <p class="eq">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)  (정반응: 발열)</p>
  <div id="controls"></div>
  <div class="chips" id="presets">
   <button data-t="-273.15">절대영도</button><button data-t="25">25°C</button><button data-t="450">450°C</button><button data-t="500">500°C</button>
  </div>
  <div class="btnrow"><button id="pause" aria-pressed="false">일시정지</button><button class="reset" id="reset">초기화</button></div>
  <label class="chk"><input type="checkbox" id="showLabels" checked> 분자 이름 표시</label>
  <div id="status" data-s="eq"></div>
  <table>
   <tr><th>분자</th><th>기본량(mol)</th><th>현재(mol)</th><th>농도(mol/L)</th></tr>
   <tr><td>N₂ 질소</td><td id="bN2"></td><td id="nN2"></td><td id="cN2"></td></tr>
   <tr><td>H₂ 수소</td><td id="bH2"></td><td id="nH2"></td><td id="cH2"></td></tr>
   <tr><td>NH₃ 암모니아</td><td id="bNH3"></td><td id="nNH3"></td><td id="cNH3"></td></tr>
   <tr><th>정반응속도</th><td id="vf" colspan="3"></td></tr>
   <tr><th>역반응속도</th><td id="vb" colspan="3"></td></tr>
   <tr><th>반응지수 (Q)</th><td id="Q" colspan="3"></td></tr>
   <tr><th>평형상수 K (k_f/k_b)</th><td id="Kc" colspan="3"></td></tr>
  </table>
 </aside>
 <main class="right">
  <div id="scene"><div id="legend"><div><i style="background:#2f6fed"></i>N₂ 질소 (파란 구 2개 + 결합)</div><div><i style="background:#f2f4f5"></i>H₂ 수소 (흰색 작은 구 2개)</div><div><i style="background:#2fb36d"></i>NH₃ 암모니아 (초록 N + 흰색 H 3개)</div></div>
   <div id="hint">드래그: 회전 · 휠/핀치: 확대</div></div>
  <div id="gwrap"><div class="gp"><canvas id="graph"></canvas></div><div class="gp"><canvas id="graph2"></canvas></div></div>
 </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===== 모든 주요 상수 =====
const CONFIG = {
  absZero: 273.15,                              // K = T + 273.15
  baseMoles: { N2: 1, H2: 3, NH3: 0 },          // 기본 몰수 (mol)
  stoich: { N2: 1, H2: 3, NH3: 2 },             // 양론 계수비 1:3:2
  T: { min: -273.15, max: 500, step: 1, def: 0 },
  V: { min: 1, max: 20, step: 0.5, def: 1 },
  inject: { min: 0, max: 10, step: 0.2 },
  // k = A·exp(-E/K): E_b > E_f 이므로 온도↑ 시 k_b의 증가 비율이 k_f보다 큼 (역반응=흡열 우세)
  kin: { Af: 40, Ef: 2000, Ab: 40000, Eb: 6000 },
  maxRate: 50.0,                                // 속도 상한 (Max Value Clamping)
  dt: 0.01, substeps: 16, maxStepFraction: 0.25, // 시간 간격, 프레임당 하위 단계, 1단계 최대 변화 비율
  eqTol: 0.03, slowRate: 1e-6,                  // 동적 평형 판정 허용 오차, 정지 판정
  viz: {
    boxBase: 1.7, refK: 298.15, baseSpeed: 0.9, baseSpin: 2.5, perMol: 4,
    maxCount: { N2: 60, H2: 80, NH3: 60 },
    speedFactor: { N2: 1, H2: 1.6, NH3: 1.15 }, margin: 0.4
  },
  histLen: 360,
  colors: { N2: '#2f6fed', H2: '#5b6770', NH3: '#1fa463' }
};

// ===== 상태 =====
const SP = ['N2', 'H2', 'NH3'];
const LBL = { N2: 'N₂', H2: 'H₂', NH3: 'NH₃' };
let T = CONFIG.T.def, V = CONFIG.V.def;
let n = { ...CONFIG.baseMoles };
let added = { N2: 0, H2: 0, NH3: 0 };
let hist = { N2: [], H2: [], NH3: [] };
let histN = { N2: [], H2: [], NH3: [] }, marks = [], pendingMark = [];
let paused = false, labelsOn = true;

// ===== UI 생성 =====
const defs = [
  { id: 'T', label: '온도', c: CONFIG.T, fmt: v => `${(+v).toFixed(0)} °C (${Math.max(0, +v + CONFIG.absZero).toFixed(0)} K)` },
  { id: 'V', label: '용기 부피', c: CONFIG.V, fmt: v => `${(+v).toFixed(1)} L` },
  { id: 'N2', label: 'N₂ 전체 주입량', c: CONFIG.inject, fmt: injFmt('N2') },
  { id: 'H2', label: 'H₂ 전체 주입량', c: CONFIG.inject, fmt: injFmt('H2') },
  { id: 'NH3', label: 'NH₃ 전체 주입량', c: CONFIG.inject, fmt: injFmt('NH3') }
];
// 전체 주입량 = 슬라이더로 넣은 누적량, 총 투입 = 기본량 + 전체 주입량
function injFmt(sp) { return v => `주입 ${(+v).toFixed(1)} mol · 총 ${(CONFIG.baseMoles[sp] + +v).toFixed(1)} mol`; }
const inputs = {}, outs = {};
const ctl = document.getElementById('controls');
defs.forEach(d => {
  const div = document.createElement('div');
  div.className = 'ctl';
  const def = d.id === 'T' ? CONFIG.T.def : d.id === 'V' ? CONFIG.V.def : 0;
  div.innerHTML = `<div class="row"><label for="s_${d.id}">${d.label}</label><output id="o_${d.id}"></output></div>
  <input type="range" id="s_${d.id}" min="${d.c.min}" max="${d.c.max}" step="${d.c.step}" value="${def}">`;
  ctl.appendChild(div);
  inputs[d.id] = div.querySelector('input');
  outs[d.id] = div.querySelector('output');
  inputs[d.id].addEventListener('input', () => onSlide(d.id));
  outs[d.id].textContent = d.fmt(def);
});

function onSlide(id) {
  const v = parseFloat(inputs[id].value);
  if (id === 'T') T = v >= 499.8 ? 500 : v;
  else if (id === 'V') V = v;
  else { // 추가 주입량 변화분을 기본(현재) 몰수에 합산
    const d = v - added[id];
    added[id] = v;
    n[id] = Math.max(0, n[id] + d);
    if (d !== 0) pendingMark.push((d > 0 ? '+' : '−') + id);
  }
  const shown = id === 'T' ? T : v;
  outs[id].textContent = defs.find(x => x.id === id).fmt(shown);
}
document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => {
  inputs.T.value = b.dataset.t; onSlide('T');
}));
document.getElementById('reset').addEventListener('click', () => {
  n = { ...CONFIG.baseMoles }; added = { N2: 0, H2: 0, NH3: 0 };
  hist = { N2: [], H2: [], NH3: [] }; histN = { N2: [], H2: [], NH3: [] }; marks = []; pendingMark = [];
  inputs.T.value = CONFIG.T.def; inputs.V.value = CONFIG.V.def;
  ['N2', 'H2', 'NH3'].forEach(s => inputs[s].value = 0);
  T = CONFIG.T.def; V = CONFIG.V.def;
  defs.forEach(d => outs[d.id].textContent = d.fmt(d.id === 'T' ? T : d.id === 'V' ? V : 0));
});

const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => {
  paused = !paused; pauseBtn.textContent = paused ? '재개' : '일시정지'; pauseBtn.setAttribute('aria-pressed', paused);
});
document.getElementById('showLabels').addEventListener('change', e => {
  labelsOn = e.target.checked; SP.forEach(s => parts[s].forEach(p => { p.lb.visible = labelsOn; }));
});

// ===== 화학 계산 =====
const conc = () => ({ N2: n.N2 / V, H2: n.H2 / V, NH3: n.NH3 / V });
function rates() {
  const K = Math.max(0, T + CONFIG.absZero), k = CONFIG.kin;
  let kf = 0, kb = 0;
  if (K > 0) { kf = k.Af * Math.exp(-k.Ef / K); kb = k.Ab * Math.exp(-k.Eb / K); } // 0 K → k = 0
  const c = conc();
  const clamp = x => (isFinite(x) ? Math.min(CONFIG.maxRate, Math.max(0, x)) : CONFIG.maxRate);
  const vf = clamp(kf * c.N2 * Math.pow(c.H2, 3));
  const vb = clamp(kb * c.NH3 * c.NH3);
  return { K, kf, kb, vf, vb, vnet: vf - vb, c };
}
function step() {
  const r = rates();
  if (r.K <= 0) return;
  // v는 mol/(L·s)이므로 몰수 변화량은 dx = v_net · V · dt
  let dx = r.vnet * V * CONFIG.dt;
  const lim = dx > 0 ? Math.min(n.N2, n.H2 / 3) : n.NH3 / 2;
  dx = Math.sign(dx) * Math.min(Math.abs(dx), lim * CONFIG.maxStepFraction);
  if (!isFinite(dx)) return;
  n.N2 = Math.max(0, n.N2 - 1 * dx);
  n.H2 = Math.max(0, n.H2 - 3 * dx);
  n.NH3 = Math.max(0, n.NH3 + 2 * dx);
}

// ===== Three.js 장면 =====
const sceneEl = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
sceneEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2a33);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(5.5, 3.8, 8.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 4; controls.maxDistance = 25;
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(5, 8, 6); scene.add(dl);

const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color: 0x7fd6e8 }));
scene.add(box);
const side = () => CONFIG.viz.boxBase * Math.cbrt(V);
let boxS = side();

function resize() {
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(sceneEl);

// 분자 모형 (THREE.Group)
const sphG = new THREE.SphereGeometry(1, 20, 16), cylG = new THREE.CylinderGeometry(1, 1, 1, 10);
const mat = c => new THREE.MeshPhongMaterial({ color: c, shininess: 70 });
const MAT = { nBlue: mat(0x2f6fed), nGreen: mat(0x2fb36d), hWhite: mat(0xf2f4f5), bond: mat(0xcfd8dc) };
const atom = (r, p, m) => { const a = new THREE.Mesh(sphG, m); a.scale.setScalar(r); a.position.set(...p); return a; };
function bond(p1, p2, r) {
  const a = new THREE.Vector3(...p1), b = new THREE.Vector3(...p2), d = b.clone().sub(a);
  const m = new THREE.Mesh(cylG, MAT.bond);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  m.scale.set(r, d.length(), r);
  return m;
}
function buildMolecule(sp) {
  const g = new THREE.Group();
  if (sp === 'N2') { // 파란 N 2개 + 결합 막대 (덤벨)
    g.add(bond([-.25, 0, 0], [.25, 0, 0], .05), atom(.16, [-.25, 0, 0], MAT.nBlue), atom(.16, [.25, 0, 0], MAT.nBlue));
  } else if (sp === 'H2') { // 회색 소형 H 2개 인접
    g.add(atom(.1, [-.1, 0, 0], MAT.hWhite), atom(.1, [.1, 0, 0], MAT.hWhite));
  } else { // 삼각뿔: N 중앙 위, H 3개 아래쪽
    const N = [0, .08, 0];
    g.add(atom(.2, N, MAT.nGreen));
    for (let i = 0; i < 3; i++) {
      const a = i * 2 * Math.PI / 3, H = [.27 * Math.cos(a), -.14, .27 * Math.sin(a)];
      g.add(bond(N, H, .035), atom(.1, H, MAT.hWhite));
    }
  }
  return g;
}
// 분자 이름표 (스프라이트)
const LAB = { N2: ['N₂ 질소', '#8fb2ff'], H2: ['H₂ 수소', '#f2f4f5'], NH3: ['NH₃ 암모니아', '#6ee0a3'] };
const labTex = {}, labMat = {};
function paintLabel(sp) {
  const cv = labTex[sp] ? labTex[sp].image : document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  const c2 = cv.getContext('2d');
  c2.font = 'bold 30px "Noto Sans KR",sans-serif'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
  c2.lineWidth = 6; c2.strokeStyle = 'rgba(10,20,26,.9)'; c2.strokeText(LAB[sp][0], 128, 32);
  c2.fillStyle = LAB[sp][1]; c2.fillText(LAB[sp][0], 128, 32);
  if (!labTex[sp]) { labTex[sp] = new THREE.CanvasTexture(cv); labMat[sp] = new THREE.SpriteMaterial({ map: labTex[sp], transparent: true, depthTest: false }); }
  else labTex[sp].needsUpdate = true;
}
SP.forEach(paintLabel);
if (document.fonts) document.fonts.ready.then(() => SP.forEach(paintLabel));
const parts = { N2: [], H2: [], NH3: [] };
const rnd = () => Math.random() * 2 - 1;
function spawn(sp) {
  const g = buildMolecule(sp), h = Math.max(0.1, boxS / 2 - CONFIG.viz.margin);
  g.position.set(rnd() * h, rnd() * h, rnd() * h);
  g.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
  const lb = new THREE.Sprite(labMat[sp]);
  lb.scale.set(0.7, 0.175, 1); lb.center.set(0.5, -0.9); lb.renderOrder = 10; lb.visible = labelsOn; g.add(lb);
  scene.add(g);
  parts[sp].push({ g, lb, dir: new THREE.Vector3(rnd(), rnd(), rnd()).normalize(), axis: new THREE.Vector3(rnd(), rnd(), rnd()).normalize() });
}
function syncCounts() {
  SP.forEach(sp => {
    const target = Math.min(CONFIG.viz.maxCount[sp], Math.round(n[sp] * CONFIG.viz.perMol));
    while (parts[sp].length < target) spawn(sp);
    while (parts[sp].length > target) scene.remove(parts[sp].pop().g);
  });
}
function move(dt) {
  const K = Math.max(0, T + CONFIG.absZero);
  if (K <= 0) return; // 0 K: 완전 정지
  const kr = K / CONFIG.viz.refK, h = boxS / 2 - CONFIG.viz.margin;
  SP.forEach(sp => {
    const spd = CONFIG.viz.baseSpeed * kr * CONFIG.viz.speedFactor[sp];
    parts[sp].forEach(p => {
      p.g.position.addScaledVector(p.dir, spd * dt);
      p.g.rotateOnAxis(p.axis, CONFIG.viz.baseSpin * kr * dt);
      ['x', 'y', 'z'].forEach(k => {
        if (Math.abs(p.g.position[k]) > h) {
          const s = Math.sign(p.g.position[k]);
          p.g.position[k] = s * h; p.dir[k] = -s * Math.abs(p.dir[k]);
        }
      });
    });
  });
}

// ===== 그래프 =====
const gcC = document.getElementById('graph'), gcN = document.getElementById('graph2');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function niceMax(m) {
  m = Math.max(m * 1.1, 0.1);
  const mag = Math.pow(10, Math.floor(Math.log10(m)));
  for (const s of [1, 2, 2.5, 5, 10]) if (s * mag >= m) return s * mag;
  return 10 * mag;
}
function drawChart(gc, data, yTitle, cur, dec, marksArr) {
  const gx = gc.getContext('2d');
  const dpr = devicePixelRatio || 1, W = gc.clientWidth, H = gc.clientHeight;
  if (!W || !H) return;
  if (gc.width !== Math.round(W * dpr) || gc.height !== Math.round(H * dpr)) { gc.width = Math.round(W * dpr); gc.height = Math.round(H * dpr); }
  gx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gx.clearRect(0, 0, W, H);
  const L = 54, R = 14, Tp = 38, B = 28, w = W - L - R, h = H - Tp - B;
  let mx = 0; SP.forEach(s => data[s].forEach(v => { if (v > mx) mx = v; }));
  const ymax = niceMax(mx), grid = css('--grid'), ink = css('--ink'), sub = css('--sub');
  gx.font = '12px "Noto Sans KR",sans-serif'; gx.textBaseline = 'middle';
  for (let i = 0; i <= 5; i++) { // Y 눈금 + 격자
    const y = Tp + h - h * i / 5, val = ymax * i / 5;
    gx.strokeStyle = grid; gx.lineWidth = 1; gx.beginPath(); gx.moveTo(L, y); gx.lineTo(L + w, y); gx.stroke();
    gx.fillStyle = sub; gx.textAlign = 'right'; gx.fillText(val.toFixed(val < 1 ? 2 : 1), L - 6, y);
  }
  for (let i = 0; i <= 8; i++) { const x = L + w * i / 8; gx.strokeStyle = grid; gx.beginPath(); gx.moveTo(x, Tp); gx.lineTo(x, Tp + h); gx.stroke(); }
  gx.strokeStyle = sub; gx.lineWidth = 1.5; gx.strokeRect(L, Tp, w, h);
  gx.fillStyle = sub; gx.textAlign = 'center'; gx.textBaseline = 'alphabetic';
  gx.fillText('시간 →', L + w / 2, H - 8);
  gx.save(); gx.translate(12, Tp + h / 2); gx.rotate(-Math.PI / 2); gx.fillText(yTitle, 0, 0); gx.restore();
  gx.lineWidth = 3.5; gx.lineJoin = 'round'; gx.lineCap = 'round';
  SP.forEach(s => {
    const a = data[s]; if (a.length < 2) return;
    gx.strokeStyle = CONFIG.colors[s]; gx.beginPath();
    a.forEach((v, i) => { const x = L + w * i / (CONFIG.histLen - 1), y = Tp + h - h * Math.min(v / ymax, 1); i ? gx.lineTo(x, y) : gx.moveTo(x, y); });
    gx.stroke();
  });
  if (marksArr) { // 주입 시점 표시
    gx.font = '11px "Noto Sans KR",sans-serif'; gx.textAlign = 'left'; gx.textBaseline = 'top';
    marksArr.forEach((m, i) => {
      if (!m) return;
      const mxp = L + w * i / (CONFIG.histLen - 1);
      gx.strokeStyle = sub; gx.globalAlpha = 0.45; gx.lineWidth = 1.5; gx.setLineDash([4, 3]);
      gx.beginPath(); gx.moveTo(mxp, Tp); gx.lineTo(mxp, Tp + h); gx.stroke(); gx.setLineDash([]); gx.globalAlpha = 1;
      if (!marksArr[i - 1]) { gx.fillStyle = ink; gx.fillText(m.map(k => k[0] + LBL[k.slice(1)]).join(' '), Math.min(mxp + 3, L + w - 70), Tp + 3); }
    });
  }
  const c = cur; let x = L; gx.font = '12px "Noto Sans KR",sans-serif'; gx.textBaseline = 'middle'; gx.textAlign = 'left';
  SP.forEach(s => { // 범례
    gx.strokeStyle = CONFIG.colors[s]; gx.lineWidth = 4; gx.beginPath(); gx.moveTo(x, 18); gx.lineTo(x + 22, 18); gx.stroke();
    const t = `[${LBL[s]}] ${c[s].toFixed(dec)}`; gx.fillStyle = ink; gx.fillText(t, x + 28, 18); x += 28 + gx.measureText(t).width + 18;
  });
}
function draw() {
  drawChart(gcC, hist, '농도 (mol/L)', conc(), 3, null);
  drawChart(gcN, histN, '몰수 (mol)', n, 2, marks);
}
new ResizeObserver(draw).observe(document.getElementById('gwrap'));

// ===== 안내/수치 표시 =====
const $ = id => document.getElementById(id);
const fmt = x => !isFinite(x) ? '∞' : (x !== 0 && Math.abs(x) < 0.01) || x >= 1e4 ? x.toExponential(2) : x.toFixed(3);
function ui() {
  const r = rates(), c = r.c;
  SP.forEach(s => { $('b' + s).textContent = CONFIG.baseMoles[s]; $('n' + s).textContent = n[s].toFixed(2); $('c' + s).textContent = c[s].toFixed(3); });
  $('vf').textContent = fmt(r.vf) + ' mol/(L·s)'; $('vb').textContent = fmt(r.vb) + ' mol/(L·s)';
  const Q = c.NH3 * c.NH3 / (c.N2 * Math.pow(c.H2, 3));
  $('Q').textContent = fmt(Q); $('Kc').textContent = r.K > 0 ? fmt(r.kf / r.kb) : '—';
  const st = $('status'); let s, t, d;
  if (r.K <= 0) { s = 'zero'; t = '절대영도 (0 K)'; d = '모든 분자 운동과 반응이 완전히 멈췄습니다 (k_f = k_b = 0).'; }
  else if (r.vf + r.vb < CONFIG.slowRate) { s = 'shift'; t = '평형 이동 (매우 느림)'; d = '온도가 너무 낮아 반응이 사실상 진행되지 않습니다.'; }
  else if (Math.abs(r.vnet) <= CONFIG.eqTol * Math.max(r.vf, r.vb)) { s = 'eq'; t = '동적 평형'; d = '정반응과 역반응 속도가 같아 농도가 일정하게 유지됩니다 (정반응속도 ≈ 역반응속도).'; }
  else if (r.vnet > 0) { s = 'shift'; t = '평형 이동: 정반응 방향'; d = 'NH₃가 생성되는 방향으로 이동 중입니다 (반응지수 Q < 평형상수 K).'; }
  else { s = 'shift'; t = '평형 이동: 역반응 방향'; d = 'NH₃가 분해되는 방향으로 이동 중입니다 (반응지수 Q > 평형상수 K).'; }
  if (paused) t = '⏸ 일시정지 · ' + t;
  st.dataset.s = s; st.innerHTML = `<b>${t}</b>${d}`;
}

// ===== 메인 루프 =====
const clock = new THREE.Clock(); let fc = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) for (let i = 0; i < CONFIG.substeps; i++) step();
  boxS += (side() - boxS) * Math.min(1, dt * 8);
  box.scale.setScalar(boxS);
  syncCounts(); if (!paused) move(dt);
  controls.update(); renderer.render(scene, camera);
  fc++;
  if ((!paused || pendingMark.length) && fc % 4 === 0) {
    const c = conc();
    SP.forEach(s => { hist[s].push(c[s]); histN[s].push(n[s]); });
    marks.push(pendingMark.length ? [...new Set(pendingMark)] : null); pendingMark = [];
    if (hist.N2.length > CONFIG.histLen) { SP.forEach(s => { hist[s].shift(); histN[s].shift(); }); marks.shift(); }
  }
  if (fc % 2 === 0) draw();
  if (fc % 6 === 0) ui();
}
resize(); ui(); frame();
</script>
